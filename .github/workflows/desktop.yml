name: Windows and Linux desktop builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.platform }} x64
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            package: dist/SMT-CHECK-windows.zip
          - os: ubuntu-22.04
            platform: linux
            package: dist/SMT-CHECK-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb xauth libgl1-mesa-dri libegl1 libgles2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build and package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/build-windows.ps1 -SkipChecks

      - name: Check Windows startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path 'dist/SMT-CHECK-windows/SMT-CHECK.exe').Path -WorkingDirectory (Resolve-Path 'dist/SMT-CHECK-windows').Path -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 10
            if ($process.HasExited) { throw "Application exited during startup with code $($process.ExitCode)" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
          }

      - name: Build and package Linux
        if: runner.os == 'Linux'
        run: bash tools/build-linux.sh --skip-checks

      - name: Check Linux startup
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set +e
          timeout 15s xvfb-run -a ./dist/SMT-CHECK-linux-x64/SMT-CHECK > linux-startup.log 2>&1
          result=$?
          set -e
          cat linux-startup.log
          if [ "$result" -ne 124 ]; then
            echo "Application did not remain running; exit code $result"
            exit 1
          fi
          if grep -E 'Unhandled Exception|ERROR:flutter|Failed to start' linux-startup.log; then
            exit 1
          fi

      - name: Upload desktop package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: SMT-CHECK-${{ matrix.platform }}-x64
          path: |
            ${{ matrix.package }}
            ${{ matrix.package }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
