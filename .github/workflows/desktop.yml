name: Multiplatform desktop builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
            package: dist/SMT-CHECK-Setup-x64.exe
          - os: windows-11-arm
            platform: windows
            arch: arm64
            package: dist/SMT-CHECK-Setup-arm64.exe
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            package: dist/SMT-CHECK-linux-amd64.deb
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            package: dist/SMT-CHECK-linux-arm64.deb
          - os: macos-15
            platform: macos
            arch: universal
            package: dist/SMT-CHECK-macos-universal.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb xauth libgl1-mesa-dri libegl1 libgles2 policykit-1

      - name: Set up Flutter
        if: matrix.arch != 'arm64'
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      # Official SDK archives do not include Windows/Linux ARM64 hosts.
      # Bootstrap the exact official source tag: its scripts fetch native Dart
      # and engine artifacts. Never run an x64 Dart VM to build Windows ARM64.
      - name: Set up native Flutter on Linux ARM64
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Set up native Flutter on Windows ARM64
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'flutter'
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE -ne 0) { throw 'Flutter source checkout failed' }
          Join-Path $sdk 'bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$sdk/bin/flutter.bat" --version
          if ($LASTEXITCODE -ne 0) { throw 'Native Flutter bootstrap failed' }

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Test startup log validation
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s tools -p 'test_startup_log.py'

      - name: Build and package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe' -OutFile "$env:RUNNER_TEMP/innosetup.exe"
          $setup = Start-Process -FilePath "$env:RUNNER_TEMP/innosetup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',"/DIR=$compilerRoot" -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw "Compiler installation failed: $($setup.ExitCode)" }
          $env:ISCC_PATH = Join-Path $compilerRoot 'ISCC.exe'
          ./tools/build-windows.ps1 -SkipChecks -Architecture '${{ matrix.arch }}'

      - name: Install, launch and uninstall Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'SMT-CHECK-Installed'
          $installer = Start-Process -FilePath (Resolve-Path '${{ matrix.package }}').Path -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$installDir",'/TASKS=' -Wait -PassThru -WindowStyle Hidden
          if ($installer.ExitCode -ne 0) { throw "Application install failed: $($installer.ExitCode)" }
          $exe = Join-Path $installDir 'SMT-CHECK.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Installed executable is missing' }
          $expectedVersion = ((Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' }) -replace '^version:\s*','') -split '\+'
          $installedVersion = ((Get-Item -LiteralPath $exe).VersionInfo.ProductVersion.Trim() -split '\+')[0]
          if ($installedVersion -ne $expectedVersion[0]) { throw 'Installed application version mismatch' }
          if ((Get-Item -LiteralPath $exe).VersionInfo.ProductName -ne 'SMT Fusion') { throw 'Product display name mismatch' }
          $legacyPrefs = Join-Path $env:APPDATA 'com.smtcheck/SMT-CHECK/shared_preferences.json'
          $fusionPrefs = Join-Path $env:APPDATA 'com.smtcheck/SMT Fusion/shared_preferences.json'
          New-Item -ItemType Directory -Path (Split-Path $legacyPrefs) -Force | Out-Null
          '{"flutter.language":"th","flutter.accentColor":"green"}' | Set-Content -LiteralPath $legacyPrefs -Encoding utf8NoBOM
          $process = Start-Process -FilePath $exe -WorkingDirectory $installDir -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 10
            if ($process.HasExited) { throw "Application exited during startup with code $($process.ExitCode)" }
            if (-not (Test-Path -LiteralPath $fusionPrefs)) { throw 'Legacy preferences were not migrated' }
            if ((Get-Content -LiteralPath $fusionPrefs -Raw | ConvertFrom-Json).'flutter.language' -ne 'th') { throw 'Migrated language mismatch' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
          }
          $update = Start-Process -FilePath (Resolve-Path '${{ matrix.package }}').Path -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/SMTFUSIONUPDATE=1',"/DIR=$installDir" -PassThru -WindowStyle Hidden
          if (-not $update.WaitForExit(120000)) { throw 'In-place installer did not finish within two minutes' }
          if ($update.ExitCode -ne 0) { throw 'In-place update failed' }
          Start-Sleep -Seconds 10
          $restarted = @(Get-Process -Name 'SMT-CHECK' -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe })
          if ($restarted.Count -ne 1) { throw 'Update did not restart the installed app exactly once' }
          $restarted | Stop-Process
          $uninstaller = Start-Process -FilePath (Join-Path $installDir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru -WindowStyle Hidden
          if ($uninstaller.ExitCode -ne 0 -or (Test-Path -LiteralPath $exe)) { throw 'Application uninstall failed' }

      - name: Build and package Linux
        if: runner.os == 'Linux'
        run: bash tools/build-linux.sh --skip-checks

      - name: Install, launch and uninstall Linux application
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          test "$(dpkg-deb -f '${{ matrix.package }}' Architecture)" = "$(dpkg --print-architecture)"
          sudo dpkg -i '${{ matrix.package }}'
          test -f /usr/share/applications/smt-check.desktop
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = next(line.split(':', 1)[1].strip().split('+')[0] for line in Path('pubspec.yaml').read_text().splitlines() if line.startswith('version:'))
          installed = json.loads(Path('/opt/smt-check/data/flutter_assets/version.json').read_text())
          assert installed['version'] == expected, installed
          PY
          set +e
          timeout 15s xvfb-run -a /usr/bin/smt-check > linux-startup.log 2>&1
          result=$?
          set -e
          cat linux-startup.log
          if [ "$result" -ne 124 ]; then
            echo "Application did not remain running; exit code $result"
            exit 1
          fi
          if grep -E 'Unhandled Exception|ERROR:flutter|Failed to start' linux-startup.log; then
            exit 1
          fi
          sudo dpkg --remove smt-check
          test ! -e /opt/smt-check/SMT-CHECK

      - name: Build and package macOS universal
        if: runner.os == 'macOS'
        run: bash tools/build-macos.sh --skip-checks

      - name: Install, launch and uninstall macOS application
        if: runner.os == 'macOS'
        run: |
          bash tools/smoke-macos.sh '${{ matrix.package }}'
          bash tools/smoke-macos-pkg.sh dist/SMT-Fusion-macos-universal.pkg

      - name: Upload desktop package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: SMT-CHECK-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ matrix.package }}
            ${{ matrix.package }}.sha256
            dist/SMT-Fusion-macos-universal.pkg*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  macos-intel:
    name: macos Intel installation
    needs: desktop
    if: always() && !cancelled()
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: SMT-CHECK-macos-universal
          path: dist
      - name: Verify checksum
        run: (cd dist && shasum -a 256 -c SMT-CHECK-macos-universal.dmg.sha256)
      - name: Install, launch and uninstall macOS application
        run: |
          bash tools/smoke-macos.sh dist/SMT-CHECK-macos-universal.dmg
          bash tools/smoke-macos-pkg.sh dist/SMT-Fusion-macos-universal.pkg
